openapi: 3.1.0
info:
  title: AZPU AI Assessment API
  version: 0.1.0
  description: One resume against one reviewed vacancy rubric. All results are for recruiter review.
paths:
  /v1/ai/assessments:
    post:
      operationId: assessResume
      summary: Extract evidence for vacancy requirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
            example:
              vacancy_revision: backend-v1
              requirements:
                - {id: python, text: Самостоятельная разработка на Python}
                - {id: fastapi, text: Самостоятельная разработка API на FastAPI}
              resume_text: Писал сервис на Python.
      responses:
        '200':
          description: Evidence and follow-up questions, including manual review after model failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
              example:
                assessment_id: 922f8d92-9062-4d8b-b1f1-e44275864c74
                state: evidence_ready
                findings:
                  - requirement_id: python
                    status: evidenced
                    evidence: {segment_id: s1, start: 0, end: 22, quote: Писал сервис на Python}
                  - requirement_id: fastapi
                    status: needs_review
                    question: Какие API на FastAPI вы реализовали самостоятельно?
        '422':
          description: Input validation failed before processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Assessment service unavailable before it can produce even a manual-review card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AssessmentRequest:
      type: object
      additionalProperties: false
      required: [vacancy_revision, requirements, resume_text]
      properties:
        vacancy_revision: {type: string, minLength: 1, maxLength: 80}
        requirements:
          type: array
          minItems: 1
          maxItems: 8
          description: Requirement IDs must be unique within the array.
          items:
            type: object
            required: [id, text]
            additionalProperties: false
            properties:
              id: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,39}$'}
              text: {type: string, minLength: 1, maxLength: 250}
        resume_text: {type: string, minLength: 1, maxLength: 16000}
    AssessmentResult:
      type: object
      additionalProperties: false
      required: [assessment_id, state, findings]
      properties:
        assessment_id: {type: string, format: uuid}
        state: {enum: [evidence_ready, manual_review]}
        reason: {enum: [context_limit, budget_limit, model_timeout, model_unavailable, invalid_model_output]}
        findings:
          type: array
          minItems: 1
          maxItems: 8
          description: One entry per requested requirement, in the original request order.
          items:
            $ref: '#/components/schemas/Finding'
      if:
        properties:
          state: {const: manual_review}
      then:
        required: [reason]
        properties:
          findings:
            items:
              properties:
                status: {const: needs_review}
    Finding:
      type: object
      additionalProperties: false
      required: [requirement_id, status]
      properties:
        requirement_id: {type: string, minLength: 1, maxLength: 40}
        status: {enum: [evidenced, needs_review]}
        evidence:
          $ref: '#/components/schemas/Evidence'
        question: {type: string, minLength: 1, maxLength: 350}
      oneOf:
        - properties:
            status: {const: evidenced}
          required: [evidence]
          not: {required: [question]}
        - properties:
            status: {const: needs_review}
          required: [question]
          not: {required: [evidence]}
    Evidence:
      type: object
      additionalProperties: false
      required: [segment_id, start, end, quote]
      description: Unicode code-point offsets, 0-based and end-exclusive, in the redacted text of the referenced segment. The server checks end > start and exact substring equality.
      properties:
        segment_id: {type: string, minLength: 1, maxLength: 50}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
        quote: {type: string, minLength: 1, maxLength: 350}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
