name: CI
on:
  pull_request:
  push:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: Check UI, real inference, and SQLite persistence
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -F /v1/ai/assessments
          curl -fsS --max-time 180 -H 'Content-Type: application/json' \
            -d '{"vacancy_revision":"ci-v1","requirements":[{"id":"python","text":"Hands-on Python development"}],"resume_text":"I built and maintained a production service in Python."}' \
            http://127.0.0.1:8000/v1/ai/assessments > /tmp/azpu-assessment.json
          jq -e '.state == "evidence_ready" and (.findings | length == 1)' /tmp/azpu-assessment.json
          docker compose restart app
          docker compose exec -T app python -c 'import json, os, sqlite3, sys; expected = json.load(sys.stdin); db = sqlite3.connect(os.environ["AZPU_DATABASE_PATH"]); row = db.execute("SELECT result_json FROM assessments WHERE id = ?", (expected["assessment_id"],)).fetchone(); assert row and json.loads(row[0]) == expected' < /tmp/azpu-assessment.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes aact@beta check
      - run: docker compose -f compose.dev.yml up -d --wait
      - run: |
          curl -fsS http://127.0.0.1:8080/ | grep -F 'Hello, world!'
          curl -fsS http://127.0.0.1:8080/api/healthz | grep -F '"mode":"stub"'
      - if: always()
        run: docker compose -f compose.dev.yml down
